[package]
name = "saga-storage-sqlite"
version = "0.1.0"
edition = "2024"
[dependencies]
thiserror = "2.0"
uuid = { version = "1.20", features = ["v4"] }
saga-core = { path = "../saga-core" }
rusqlite = { version = "0.38", features = ["bundled"] }
chrono = "0.4.43"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
dirs = "6"
