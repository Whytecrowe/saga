[package]
name = "saga-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
saga-core = { path = "../saga-core" }
saga-storage-sqlite = { path = "../saga-storage-sqlite" }
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
uuid = { version = "1.11", features = ["v4"] }
anyhow = "1.0"  # Better error handling for apps
dirs = "5.0"