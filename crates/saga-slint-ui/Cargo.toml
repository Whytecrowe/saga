[package]
name = "saga-slint-ui"
version = "0.1.0"
edition = "2024"

[package.metadata.android]
package = "com.saga.journal"
label = "Saga Journal"

[lib]
crate-type = ["cdylib", "rlib"]  # Required for Android

[[bin]]
name = "saga"
path = "src/main.rs"

[dependencies]
saga-core = { path = "../saga-core" }
saga-storage-sqlite = { path = "../saga-storage-sqlite" }
chrono = "0.4"
uuid = "1.11"
android_logger = "0.15.1"
log = "0.4.29"
ndk-context = "0.1.1"
jni = "0.21.1"

# Platform-specific dependencies
[target.'cfg(target_os = "android")'.dependencies]
slint = { workspace = true, features = ["backend-android-activity-06", "renderer-software", "compat-1-2"] }
jni = "0.21"

[target.'cfg(target_os = "windows")'.dependencies]
slint = { workspace = true, features = ["backend-winit", "renderer-femtovg", "compat-1-2"] }


[build-dependencies]
slint-build = { workspace = true }