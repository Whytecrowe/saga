[package]
name = "saga-slint-ui"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]  # Required for Android

[[bin]]
name = "saga"
path = "src/main.rs"

[dependencies]
saga-core = { path = "../saga-core" }
saga-storage-sqlite = { path = "../saga-storage-sqlite" }
chrono = "0.4"
uuid = "1.11"
android_logger = "0.15.1"
log = "0.4.29"

# Platform-specific dependencies
[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.9", default-features = false, features = ["backend-android-activity-06", "renderer-software", "compat-1-2"] }

[target.'cfg(target_os = "windows")'.dependencies]
slint = { version = "1.9", default-features = false, features = ["backend-winit", "renderer-software", "compat-1-2"] }


[build-dependencies]
slint-build = "1.15.0"